spring:
  application:
    name: job-app-service
  datasource:
    url: jdbc:h2:mem:demo_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    # url: jdbc:h2:file:./data/jobtracker;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
    defaults:
      enabled: true

info:
  app:
    name: "The Job Applications app"
    version: "1.0.0"

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
    org.springframework.boot.actuate: DEBUG